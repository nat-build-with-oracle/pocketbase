name: basebuild

on:
  pull_request:
  push:

jobs:
  goreleaser:
    # fork (nat-build-with-oracle): the plugin's own tags release in the passkey job below
    if: ${{ !startsWith(github.ref, 'refs/tags/plugins/') }}
    runs-on: ubuntu-latest
    env:
      flags: ""
    steps:
      # re-enable auto-snapshot from goreleaser-action@v3
      # (https://github.com/goreleaser/goreleaser-action-v4-auto-snapshot-example)
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: echo "flags=--snapshot" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # fork: snapshots version off the newest upstream v* tag, never off a plugins/* tag
      # (goreleaser refuses "plugins/passkey/vX.Y.Z" as a version)
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: echo "GORELEASER_CURRENT_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*')" >> $GITHUB_ENV

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '>=25.2.1'

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '>=1.27.3'

      # This step usually is not needed because the /ui/dist is pregenerated locally
      # but its here to ensure that each release embeds the latest admin ui artifacts.
      # If the artificats differs, a "dirty error" is thrown - https://goreleaser.com/errors/dirty/
      - name: Build Admin dashboard UI
        run: npm --prefix=./ui ci && npm --prefix=./ui run build

      # Temporary disable as the types can have random generated identifiers making it non-deterministic.
      #
      # # Similar to the above, the jsvm types are pregenerated locally
      # # but its here to ensure that it wasn't forgotten to be executed.
      # - name: Generate jsvm types
      #   run: go run ./plugins/jsvm/internal/types/types.go

      - name: Run tests
        run: go test ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean ${{ env.flags }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # fork (nat-build-with-oracle): plugins/passkey is its own Go module on upstream PocketBase.
  # Every push / PR: vet + test it. A tag plugins/passkey/vX.Y.Z (the Go module version tag, so
  # `go get github.com/nat-build-with-oracle/pocketbase/plugins/passkey@vX.Y.Z` works) also
  # builds a ready-to-run PocketBase with passkeys for each platform and publishes a release.
  passkey:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: plugins/passkey
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: plugins/passkey/go.mod
          cache-dependency-path: plugins/passkey/go.sum

      - name: Vet and test the plugin
        run: |
          go vet ./...
          go test ./...

      - name: Build PocketBase + passkey binaries
        if: ${{ startsWith(github.ref, 'refs/tags/plugins/passkey/v') }}
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#plugins/passkey/}"
          PBV="$(go list -m -f '{{.Version}}' github.com/pocketbase/pocketbase)"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 linux/arm darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"; ext=""; [ "$os" = windows ] && ext=".exe"
            out="build/${os}_${arch}"; mkdir -p "$out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" GOARM=7 go build -trimpath \
              -ldflags "-s -w -X github.com/pocketbase/pocketbase.Version=${PBV#v}+passkey.${V#v}" \
              -o "$out/pocketbase$ext" ./examples/base
            cp ../../LICENSE.md README.md "$out/"
            (cd "$out" && zip -q "../../dist/pocketbase-passkey_${V#v}_${os}_${arch}.zip" *)
          done
          (cd dist && sha256sum *.zip > checksums.txt)
          echo "PBV=$PBV" >> "$GITHUB_ENV"
          echo "V=$V" >> "$GITHUB_ENV"

      - name: Publish the release
        if: ${{ startsWith(github.ref, 'refs/tags/plugins/passkey/v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "PocketBase ${PBV} + passkey ${V}" \
            --notes "PocketBase ${PBV} (upstream, unchanged) with the passkey plugin ${V}: sign in with Touch ID, Face ID, Windows Hello, a phone or a security key. See plugins/passkey/README.md."

  # fork (nat-build-with-oracle): public container image ghcr.io/nat-build-with-oracle/pocketbase-passkey
  # (linux/amd64 + linux/arm64). Every push to the passkey branch -> :edge; a tag
  # plugins/passkey/vX.Y.Z -> :X.Y.Z and :latest. Built only after the plugin's tests pass.
  image:
    needs: passkey
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/passkey' || startsWith(github.ref, 'refs/tags/plugins/passkey/v')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/plugins/passkey/v* ]]; then
            V="${GITHUB_REF_NAME#plugins/passkey/v}"
            echo "VERSION=$V" >> "$GITHUB_ENV"
            echo "TAGS=ghcr.io/${GITHUB_REPOSITORY_OWNER}/pocketbase-passkey:${V},ghcr.io/${GITHUB_REPOSITORY_OWNER}/pocketbase-passkey:latest" >> "$GITHUB_ENV"
          else
            echo "VERSION=edge-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
            echo "TAGS=ghcr.io/${GITHUB_REPOSITORY_OWNER}/pocketbase-passkey:edge" >> "$GITHUB_ENV"
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: plugins/passkey
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.TAGS }}
          build-args: VERSION=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=pocketbase-passkey
            org.opencontainers.image.description=PocketBase with passkey (fingerprint / Face ID / security key) sign-in
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
